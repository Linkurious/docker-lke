{{- if .Values.gateway.enabled -}}
{{- $fullName := include "linkurious-enterprise.fullname" . -}}
{{- $defaultHostUrl := include "linkurious-enterprise.defaultHostUrl" . -}}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $fullName }}
  labels:
    {{- include "linkurious-enterprise.labels" . | nindent 4 }}
  {{- with .Values.gateway.labels }}
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.gateway.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.gateway.parentRefs }}
  parentRefs:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  hostnames:
    {{- if .Values.gateway.hostnames }}
    {{- range .Values.gateway.hostnames }}
    - {{ . | quote }}
    {{- end }}
    {{- else }}
    - {{ $defaultHostUrl | quote }}
    {{- end }}
  rules:
    - matches:
        {{- range .Values.gateway.paths }}
        - path:
            type: {{ .type | default "PathPrefix" }}
            value: {{ .path | default "/" }}
        {{- end }}
      backendRefs:
        - name: {{ $fullName }}
          port: {{ .Values.service.port }}
      {{- if .Values.ipAllowList }}
      filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: {{ $fullName }}-ipallowlist
      {{- end }}
      {{- with .Values.gateway.sessionPersistence }}
      sessionPersistence:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
