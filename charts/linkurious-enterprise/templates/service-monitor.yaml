{{- $otelMetricsEnabled := and .Values.openTelemetry.enabled .Values.openTelemetry.metrics.enabled }}
{{- $legacyMetricsEnabled := and .Values.metrics.prometheus .Values.metrics.prometheus.enabled }}
{{- $metricsEnabled := or $otelMetricsEnabled $legacyMetricsEnabled }}
{{- $serviceMonitor := ternary .Values.openTelemetry.metrics.serviceMonitor .Values.metrics.prometheus.serviceMonitor $otelMetricsEnabled }}
{{- $disableAPICheck := ternary .Values.openTelemetry.metrics.disableAPICheck .Values.metrics.prometheus.disableAPICheck $otelMetricsEnabled }}
{{- $entryPoint := ternary .Values.openTelemetry.metrics.entryPoint .Values.metrics.prometheus.entryPoint $otelMetricsEnabled }}
{{- if and $metricsEnabled $serviceMonitor }}
  {{- if (not (.Capabilities.APIVersions.Has "monitoring.coreos.com/v1")) }}
    {{- if (not ($disableAPICheck)) }}
      {{- fail "ERROR: You have to deploy monitoring.coreos.com/v1 first or disable prometheus" }}
    {{- end }}
  {{- end }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ template "linkurious-enterprise.fullname" . }}
  {{- with $serviceMonitor.namespace }}
  namespace: {{ . }}
  {{- end }}
  labels:
    {{- include "linkurious-enterprise.labels" . | nindent 4 }}
    {{- with $serviceMonitor.additionalLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  jobLabel: {{ $serviceMonitor.jobLabel | default .Release.Name }}
  endpoints:
    - port: http-metrics
      path: /{{ $entryPoint }}
      {{- with $serviceMonitor.honorLabels }}
      honorLabels: {{ . }}
      {{- end }}
      {{- with $serviceMonitor.honorTimestamps }}
      honorTimestamps: {{ . }}
      {{- end }}
      {{- with $serviceMonitor.enableHttp2 }}
      enableHttp2: {{ . }}
      {{- end }}
      {{- with $serviceMonitor.followRedirects }}
      followRedirects: {{ . }}
      {{- end }}
      {{- with $serviceMonitor.interval }}
      interval: {{ . }}
      {{- end }}
      {{- with $serviceMonitor.scrapeTimeout }}
      scrapeTimeout: {{ . }}
      {{- end }}
{{- if $serviceMonitor.metricRelabelings }}
      metricRelabelings:
{{ tpl (toYaml $serviceMonitor.metricRelabelings | indent 6) . }}
{{- end }}
{{- if $serviceMonitor.relabelings }}
      relabelings:
{{ toYaml $serviceMonitor.relabelings | indent 6 }}
{{- end }}
  {{- if $serviceMonitor.namespaceSelector }}
  namespaceSelector:
{{ toYaml $serviceMonitor.namespaceSelector | indent 4 -}}
  {{ else }}
  namespaceSelector:
    matchNames:
      - {{ .Release.Namespace }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "linkurious-enterprise.selectorLabels" . | nindent 6 }}
{{- end }}
